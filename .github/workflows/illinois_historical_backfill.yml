
name: Illinois historical report card backfill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and extract historical IAR outcomes
        run: |
          python3 collect_illinois_history.py \
            --inventory midwest_school_inventory.csv \
            --years 2019,2020,2021,2022,2023,2024,2025

      - name: Upload historical data and audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: illinois-history-${{ github.run_number }}
          path: output/illinois_history/*
          if-no-files-found: warn
          retention-days: 30
