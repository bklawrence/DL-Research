
name: Collect Illinois school IDs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect Illinois school IDs
        run: python3 collect_illinois_school_ids.py

      - name: Upload school ID crosswalk
        uses: actions/upload-artifact@v4
        with:
          name: illinois-school-ids
          path: output/illinois_school_ids.csv
          if-no-files-found: error
